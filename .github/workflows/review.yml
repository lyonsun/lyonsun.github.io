name: Opencode PR Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    if: github.actor != 'renovate[bot]' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Run PR review
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/deepseek-v4-flash-free
          use_github_token: true
          prompt: |
            You are reviewing a personal portfolio/blog site built with Astro.

            Project conventions:
            - Blog posts in src/content/posts/ use frontmatter fields: title, description, pubDate, tags, draft, aiGeneratedContent, author
            - Posts are generated by an AI workflow and start with both draft: true and aiGeneratedContent: true
            - Removing draft: true is the intentional publish action — do NOT flag it
            - aiGeneratedContent: true stays forever to mark the post as AI-assisted
            - The description field in frontmatter must be a single-line, complete sentence (no truncation, no multi-line YAML)

            Review this pull request:
            - Check for code quality issues
            - Look for potential bugs
            - Suggest improvements
