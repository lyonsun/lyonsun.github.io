name: PR Reviewer

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    if: github.actor != 'renovate[bot]' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Run PR review
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/deepseek-v4-flash-free
          use_github_token: true
          prompt: |
            You are reviewing a pull request for a personal portfolio/blog site built with **Astro 6**.

            # Context

            ## Tech stack
            - Framework: Astro 6
            - Styling: Tailwind CSS v4 (via @tailwindcss/vite plugin)
            - Language: TypeScript (strict mode)
            - Content: Markdown blog posts with Zod-validated frontmatter
            - Formatting: Prettier (tab width 4, single quotes, trailing commas all, semicolons required)

            ## Project structure
            - src/components/ — atomic design: atoms/, elements/, sections/, icons/
            - src/content/posts/ — blog posts (Markdown with frontmatter)
            - src/content.config.ts — content collection schema
            - src/consts.ts — site constants (SITE_NAME, SITE_DESCRIPTION, etc.)
            - scripts/ — LLM-powered blog generation scripts

            ## Content conventions
            - Blog posts use frontmatter fields: title, description, pubDate, tags, draft, aiGeneratedContent, author
            - Posts generated by AI start with both draft: true and aiGeneratedContent: true
            - Removing draft: true is the intentional publish action — do NOT flag it
            - aiGeneratedContent: true stays forever to mark the post as AI-assisted
            - The description field must be a single-line, complete sentence
            - Use sentence case for post titles (not title case)
            - Tags must exist in the content config or be consistent with existing usage

            ## Code conventions
            - Tab width: 4 spaces
            - Single quotes, trailing commas: all, semicolons required
            - Decorative SVGs: aria-hidden="true"
            - External links: rel="noopener noreferrer"
            - Conventional commits: type(scope): description (under 50 chars)

            # Review focus

            Focus your review on:
            - **Correctness**: Bugs, type errors, logical mistakes
            - **Consistency**: Follows project conventions (code style, naming, structure)
            - **Robustness**: Error handling, edge cases, security concerns
            - **Clarity**: Readable, well-structured code

            Do NOT comment on:
            - AI-generated content markers (draft: true, aiGeneratedContent: true)
            - Trivial formatting that Prettier handles
            - Missing features outside the PR scope

            Provide actionable, specific feedback. If everything looks good, say so concisely.
