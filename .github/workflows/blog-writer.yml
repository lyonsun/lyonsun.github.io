name: Blog Writer

on:
  schedule:
    - cron: "0 3 * * 1,3,5"
  workflow_dispatch:
    inputs:
      topic_slug:
        description: "Specific topic slug to generate (optional)"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      AI_MODEL: ${{ vars.AI_MODEL || 'llama-3.3-70b-versatile' }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Setup blog branch
        id: setup
        run: |
          DATE=$(date +%Y-%m-%d)
          BRANCH="blog/${DATE}"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "branch_name=$BRANCH" >> "$GITHUB_OUTPUT"
          git fetch origin "$BRANCH" 2>/dev/null || true
          if git show-ref --verify --quiet "refs/remotes/origin/$BRANCH"; then
            git checkout "$BRANCH"
            echo "branch_exists=true" >> "$GITHUB_OUTPUT"
          else
            git checkout -b "$BRANCH"
            echo "branch_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Compose blog post
        if: steps.setup.outputs.branch_exists == 'false'
        id: compose
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          TOPIC_SLUG: ${{ inputs.topic_slug || '' }}
        run: |
          if [ -n "$TOPIC_SLUG" ]; then
            node .github/scripts/write-post.mjs "$TOPIC_SLUG"
          else
            node .github/scripts/write-post.mjs
          fi

      - name: Revise blog post
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
        run: |
          # Find post file: uncommitted from compose (initial) or git diff vs main (revision)
          POST_FILE=$(git status --porcelain src/content/posts/ 2>/dev/null | sed -n 's/^?? //p' | head -1)
          if [ -z "$POST_FILE" ]; then
            POST_FILE=$(git diff --diff-filter=A --name-only origin/main...HEAD -- 'src/content/posts/*.md' 2>/dev/null | head -1)
          fi
          if [ -z "$POST_FILE" ]; then
            echo "No existing post found."
            exit 0
          fi
          # The blog branch was forked before scripts were added to main
          if [ ! -f .github/scripts/revise-post.mjs ]; then
            git show main:.github/scripts/revise-post.mjs > .github/scripts/revise-post.mjs
          fi
          node .github/scripts/revise-post.mjs "$POST_FILE"

      - name: Validate and re-revise blog post
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
        run: |
          POST_FILE=$(git status --porcelain src/content/posts/ 2>/dev/null | sed -n 's/^?? //p' | head -1)
          if [ -z "$POST_FILE" ]; then
            POST_FILE=$(git diff --diff-filter=A --name-only origin/main...HEAD -- 'src/content/posts/*.md' 2>/dev/null | head -1)
          fi
          if [ -z "$POST_FILE" ]; then
            echo "No post file found for validation."
            exit 0
          fi

          # The blog branch was forked before scripts were added to main
          if [ ! -f .github/scripts/validate-post.mjs ]; then
            git show main:.github/scripts/validate-post.mjs > .github/scripts/validate-post.mjs
          fi

          MAX_RETRIES=2
          for ((i=1; i<=MAX_RETRIES; i++)); do
            echo "Validating code examples (attempt $i)..."
            if VALIDATION_OUTPUT=$(node .github/scripts/validate-post.mjs --json "$POST_FILE" 2>/dev/null); then
              VALID_EXIT=0
            else
              VALID_EXIT=$?
            fi

            if [ $VALID_EXIT -eq 0 ]; then
              echo "All code examples pass validation."
              break
            fi

            echo "Found issues, re-revising post..."
            sleep 3
            echo "$VALIDATION_OUTPUT" > /tmp/validation-errors.json
            node .github/scripts/revise-post.mjs --errors-file /tmp/validation-errors.json "$POST_FILE"
            rm -f /tmp/validation-errors.json
          done

          # Final validation check
          node .github/scripts/validate-post.mjs "$POST_FILE" || echo "Warning: Some validation issues remain after revision."

      - name: Check formatting
        run: npx prettier --check .

      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Create Pull Request
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.BLOG_WRITER_PAT }}
        run: |
          if git diff --quiet && git ls-files --others --exclude-standard --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "Liang Sun"
          git config user.email "sunly917@gmail.com"

          if [ "${{ steps.setup.outputs.branch_exists }}" = "false" ]; then
            git add src/content/posts/ .github/scripts/topics.json
            git commit -m "content(posts): add new post for ${{ steps.setup.outputs.date }}"
          else
            git add src/content/posts/
            git commit -m "content(posts): revise post for ${{ steps.setup.outputs.date }}"
          fi

          git remote set-url origin https://x-access-token:${{ secrets.BLOG_WRITER_PAT }}@github.com/lyonsun/lyonsun.github.io
          git push origin HEAD:"${{ steps.setup.outputs.branch_name }}"

          if [ "${{ steps.setup.outputs.branch_exists }}" = "false" ]; then
            SLUG="${{ steps.compose.outputs.topic-slug }}"
            gh pr create \
              --title "content(posts): add new post for ${{ steps.setup.outputs.date }}" \
              --body "This PR adds an AI-generated blog post draft.

          Topic slug: ${SLUG}

          **Note:** The post has \`draft: true\` and \`aiGeneratedContent: true\`. Review and remove \`draft: true\` before publishing."
          else
            echo "PR already exists for this branch."
          fi
