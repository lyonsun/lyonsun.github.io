name: Blog Writer

on:
  schedule:
    - cron: "0 9 * * 1,4"
  workflow_dispatch:
    inputs:
      topic_slug:
        description: "Specific topic slug to generate (optional)"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Setup blog branch
        id: setup
        run: |
          DATE=$(date +%Y-%m-%d)
          BRANCH="blog/${DATE}"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "branch_name=$BRANCH" >> "$GITHUB_OUTPUT"
          git fetch origin "$BRANCH" 2>/dev/null || true
          if git show-ref --verify --quiet "refs/remotes/origin/$BRANCH"; then
            git checkout "$BRANCH"
            echo "branch_exists=true" >> "$GITHUB_OUTPUT"
          else
            git checkout -b "$BRANCH"
            echo "branch_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Compose blog post
        if: steps.setup.outputs.branch_exists == 'false'
        id: compose
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TOPIC_SLUG: ${{ inputs.topic_slug || '' }}
        run: |
          if [ -n "$TOPIC_SLUG" ]; then
            node .github/scripts/write-post.mjs "$TOPIC_SLUG"
          else
            node .github/scripts/write-post.mjs
          fi

      - name: Revise blog post
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          POST_FILE=$(printf '%s\n' src/content/posts/${{ steps.setup.outputs.date }}-*.md 2>/dev/null | head -1)
          if [ -z "$POST_FILE" ]; then
            echo "No existing post found for ${{ steps.setup.outputs.date }}."
            exit 0
          fi
          # The blog branch was forked before revise-post.mjs was added to main
          if [ ! -f .github/scripts/revise-post.mjs ]; then
            git show main:.github/scripts/revise-post.mjs > .github/scripts/revise-post.mjs
          fi
          node .github/scripts/revise-post.mjs "$POST_FILE"

      - name: Check formatting
        run: npx prettier --check .

      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Create Pull Request
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.BLOG_WRITER_PAT }}
        run: |
          if git diff --quiet && git ls-files --others --exclude-standard --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "Liang Sun"
          git config user.email "sunly917@gmail.com"

          if [ "${{ steps.setup.outputs.branch_exists }}" = "false" ]; then
            git add src/content/posts/ .github/scripts/topics.json
            git commit -m "content(posts): add new post for ${{ steps.setup.outputs.date }}"
          else
            git add src/content/posts/
            git commit -m "content(posts): revise post for ${{ steps.setup.outputs.date }}"
          fi

          git remote set-url origin https://x-access-token:${{ secrets.BLOG_WRITER_PAT }}@github.com/lyonsun/lyonsun.github.io
          git push origin HEAD:"${{ steps.setup.outputs.branch_name }}"

          if [ "${{ steps.setup.outputs.branch_exists }}" = "false" ]; then
            SLUG="${{ steps.compose.outputs.topic-slug }}"
            gh pr create \
              --title "content(posts): add new post for ${{ steps.setup.outputs.date }}" \
              --body "This PR adds an AI-generated blog post draft.

          Topic slug: ${SLUG}

          **Note:** The post has \`draft: true\` and \`aiGeneratedContent: true\`. Review and remove \`draft: true\` before publishing."
          else
            echo "PR already exists for this branch."
          fi
