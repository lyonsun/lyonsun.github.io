name: Blog Writer

on:
  schedule:
    - cron: "0 3 * * 1,3,5"
  workflow_dispatch:
    inputs:
      topic_slug:
        description: "Specific topic slug to generate (optional)"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      AI_MODEL: ${{ vars.AI_MODEL || 'llama-3.3-70b-versatile' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup blog branch
        id: setup
        run: |
          DATE=$(date +%Y-%m-%d)
          BRANCH="blog/${DATE}"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "branch_name=$BRANCH" >> "$GITHUB_OUTPUT"
          git fetch origin "$BRANCH" 2>/dev/null || true
          if git show-ref --verify --quiet "refs/remotes/origin/$BRANCH"; then
            git checkout "$BRANCH"
            echo "branch_exists=true" >> "$GITHUB_OUTPUT"
          else
            git checkout -b "$BRANCH"
            echo "branch_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Compose blog post
        if: steps.setup.outputs.branch_exists == 'false'
        id: compose
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          TOPIC_SLUG: ${{ inputs.topic_slug || '' }}
        run: |
          if [ -n "$TOPIC_SLUG" ]; then
            node .github/scripts/write-post.mjs "$TOPIC_SLUG"
          else
            node .github/scripts/write-post.mjs
          fi

      - name: Resolve blog writer helpers
        run: |
          BLOG_WRITER_WORKFLOW=".github/scripts/blog-writer-workflow.mjs"
          if [ ! -f "$BLOG_WRITER_WORKFLOW" ]; then
            BLOG_WRITER_WORKFLOW="/tmp/blog-writer-workflow.mjs"
            git show main:.github/scripts/blog-writer-workflow.mjs > "$BLOG_WRITER_WORKFLOW"
          fi
          echo "BLOG_WRITER_WORKFLOW=$BLOG_WRITER_WORKFLOW" >> "$GITHUB_ENV"

      - name: Revise blog post
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
        run: node "$BLOG_WRITER_WORKFLOW" revise

      - name: Validate and re-revise blog post
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
        run: node "$BLOG_WRITER_WORKFLOW" validate

      - name: Check formatting
        run: npx prettier --check .

      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Create Pull Request
        if: success()
        env:
          AI_MODEL_USED: ${{ steps.compose.outputs.ai-model }}
          GENERATED_DATE: ${{ steps.setup.outputs.date }}
          GITHUB_TOKEN: ${{ secrets.BLOG_WRITER_PAT }}
          POST_FILE: ${{ steps.compose.outputs.post-file }}
          TOPIC_SLUG: ${{ steps.compose.outputs.topic-slug }}
          TOPIC_TITLE: ${{ steps.compose.outputs.topic-title }}
        run: |
          if [ "${{ steps.setup.outputs.branch_exists }}" = "false" ]; then
            git add src/content/posts/ .github/scripts/topics.json
          else
            git add src/content/posts/
          fi

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "Liang Sun"
          git config user.email "sunly917@gmail.com"

          if [ "${{ steps.setup.outputs.branch_exists }}" = "false" ]; then
            git commit -m "content(posts): add new post for ${{ steps.setup.outputs.date }}"
          else
            git commit -m "content(posts): revise post for ${{ steps.setup.outputs.date }}"
          fi

          git remote set-url origin https://x-access-token:${{ secrets.BLOG_WRITER_PAT }}@github.com/lyonsun/lyonsun.github.io
          git push origin HEAD:"${{ steps.setup.outputs.branch_name }}"

          if [ "${{ steps.setup.outputs.branch_exists }}" = "false" ]; then
            PR_BODY_FILE="$(mktemp)"
            node "$BLOG_WRITER_WORKFLOW" render-pr-body > "$PR_BODY_FILE"

            gh pr create \
              --title "content(posts): add new post for ${{ steps.setup.outputs.date }}" \
              --body-file "$PR_BODY_FILE"
          else
            echo "PR already exists for this branch."
          fi
