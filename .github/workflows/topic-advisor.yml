name: Topic Advisor

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      AI_MODEL: ${{ vars.AI_MODEL || 'llama-3.3-70b-versatile' }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Setup topics branch
        id: setup
        run: |
          DATE=$(date +%Y-%m-%d)
          BRANCH="topics/${DATE}"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "branch_name=$BRANCH" >> "$GITHUB_OUTPUT"
          git fetch origin "$BRANCH" 2>/dev/null || true
          if git show-ref --verify --quiet "refs/remotes/origin/$BRANCH"; then
            echo "Branch $BRANCH already exists. Topics likely already generated today."
            echo "branch_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "branch_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run topic advisor
        if: steps.setup.outputs.branch_exists == 'false'
        id: generate
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
        run: node .github/scripts/topic-advisor.mjs

      - name: Format topics.json
        if: steps.generate.outputs.topics-added != '' && steps.generate.outputs.topics-added != '0'
        run: npx prettier --write .github/scripts/topics.json

      - name: Create Pull Request
        if: steps.generate.outputs.topics-added != '' && steps.generate.outputs.topics-added != '0'
        env:
          GITHUB_TOKEN: ${{ secrets.BLOG_WRITER_PAT }}
        run: |
          BRANCH="${{ steps.setup.outputs.branch_name }}"

          git config user.name "Liang Sun"
          git config user.email "sunly917@gmail.com"

          git checkout -b "$BRANCH"
          git add .github/scripts/topics.json
          git commit -m "content(posts): add ${{ steps.generate.outputs.topics-added }} new topic(s) to queue"

          git push origin HEAD:"${BRANCH}"

          gh pr create \
            --title "content(posts): add ${{ steps.generate.outputs.topics-added }} new topic(s) to queue" \
            --body "${{ steps.generate.outputs.pr-body }}"
